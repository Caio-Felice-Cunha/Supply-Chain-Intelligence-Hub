name: Deploy quality report to Pages
on:
  push:
    branches: [main]
    paths:
      - outputs/reports/supply_chain_quality_report.html
      - outputs/quality_summary.json
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static report
        shell: bash
        run: |
          mkdir -p _site
          cp outputs/reports/supply_chain_quality_report.html _site/index.html
          cp outputs/quality_summary.json _site/quality_summary.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
