name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start seeded MySQL
        run: docker compose up -d --build --wait mysql
      - name: Inspect healthy service
        run: docker compose ps --status running mysql
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
